services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: f1
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
    ports:
      - "55432:5432"
    volumes:
      - f1-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1"]
      interval: 5s
      timeout: 5s
      retries: 10

  reporting-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: f1_reporting
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
    ports:
      - "5433:5432"
    volumes:
      - f1-reporting-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U f1 -d f1_reporting"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: f1
      RABBITMQ_DEFAULT_PASS: f1
    ports:
      - "5672:5672"
      - "15672:15672"
    healthcheck:
      test: ["CMD", "rabbitmq-diagnostics", "-q", "ping"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis-commander:
    image: rediscommander/redis-commander:latest
    environment:
      REDIS_HOSTS: "local:redis:6379"
    ports:
      - "8081:8081"
    depends_on:
      redis:
        condition: service_healthy

  ticketing-api:
    build:
      context: ./backend/F1Ticketing.Api
    ports:
      - "5284:8080"
    restart: on-failure
    environment:
      ConnectionStrings__Default: "Host=postgres;Port=5432;Database=f1;Username=f1;Password=f1"
      ConnectionStrings__Redis: "redis:6379"
      RabbitMq__ConnectionString: "amqp://f1:f1@rabbitmq:5672/"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  reporting-api:
    build:
      context: ./backend/F1Reporting.Api
    ports:
      - "5167:8080"
    restart: on-failure
    environment:
      ConnectionStrings__Default: "Host=reporting-postgres;Port=5432;Database=f1_reporting;Username=f1;Password=f1"
      RabbitMq__ConnectionString: "amqp://f1:f1@rabbitmq:5672/"
    depends_on:
      reporting-postgres:
        condition: service_healthy
      rabbitmq:
        condition: service_healthy

  ticketing-frontend:
    build:
      context: ./frontend/ticketing
    ports:
      - "5173:5173"
    environment:
      API_PROXY_TARGET: "http://ticketing-api:8080"
    depends_on:
      - ticketing-api

  reporting-frontend:
    build:
      context: ./frontend/reporting
    ports:
      - "5174:5174"
    environment:
      API_PROXY_TARGET: "http://reporting-api:8080"
    depends_on:
      - reporting-api

  pgadmin:
    image: dpage/pgadmin4
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: admin@admin.com
      PGADMIN_DEFAULT_PASSWORD: admin
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
      reporting-postgres:
        condition: service_healthy

volumes:
  f1-postgres-data:
  f1-reporting-postgres-data:
  pgadmin-data:
