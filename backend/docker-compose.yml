services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: f1
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
    ports:
      - "55432:5432"
    volumes:
      - f1-postgres-data:/var/lib/postgresql/data

  reporting-postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: f1_reporting
      POSTGRES_USER: f1
      POSTGRES_PASSWORD: f1
    ports:
      - "5433:5432"
    volumes:
      - f1-reporting-postgres-data:/var/lib/postgresql/data

  redis:
    image: redis:7-alpine
    ports:
      - "6379:6379"

  rabbitmq:
    image: rabbitmq:3-management-alpine
    environment:
      RABBITMQ_DEFAULT_USER: f1
      RABBITMQ_DEFAULT_PASS: f1
    ports:
      - "5672:5672"
      - "15672:15672"

volumes:
  f1-postgres-data:
  f1-reporting-postgres-data:
